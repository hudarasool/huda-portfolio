<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel | Huda</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script src="../js/loader.js"></script>
</head>
<body>
<noscript><p style="padding:24px">The Admin Panel needs JavaScript turned on.</p></noscript>
<div id="boot" class="boot">Loading…</div>
<main id="login" class="login" hidden>
  <form id="lf" class="lbox" autocomplete="on">
    <h1>Admin Panel</h1>
    <p class="sub">Sign in to manage your website.</p>
    <label>Username<input id="lu" name="username" autocomplete="username" required></label>
    <label>Password<input id="lp" name="password" type="password" autocomplete="current-password" required></label>
    <p id="lerr" class="err" role="alert"></p>
    <button class="btn pri" type="submit">Sign in</button>
  </form>
</main>
<div id="app" class="app" hidden>
  <header class="top"><strong>Huda<b>.</b> Admin</strong><span><a class="btn ghost sm" href="../index.html" target="_blank" rel="noopener">View live website ↗</a> <button class="btn ghost sm" id="logout">Sign out</button></span></header>
  <div class="shell"><nav id="side" aria-label="Admin sections"></nav><section id="main" class="mainc" tabindex="-1"></section></div>
  <div class="bar"><span id="state">All changes saved</span><button class="btn pri" id="save" disabled>Save changes</button></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="../js/content.js"></script>
<script src="admin.js"></script>
</body>
</html>
